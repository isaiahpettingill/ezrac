[workspace]

[package]
name = "ezrac-dos"
version = "0.1.35"
edition = "2024"
publish = false

[lib]
name = "ezrac_dos"
path = "src/lib.rs"
crate-type = ["staticlib"]

[features]
default = ["ezfe"]
ezfe = ["ezra/dos-frontend"]
ezopt = ["ezra/dos-optimizer"]
ezcg = ["ezra/dos-codegen"]
ezas = ["ezra/dos-assembler"]

[dependencies]
ezra = { package = "ezra-core", path = "..", default-features = false, features = ["no-std", "i8086"] }

[profile.dev]
opt-level = 1
panic = "abort"

[profile.release]
opt-level = "z"
lto = false
codegen-units = 16
panic = "abort"
strip = "debuginfo"
