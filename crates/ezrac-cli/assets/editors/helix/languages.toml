[[language]]
name = "ezra"
scope = "source.ezra"
file-types = ["ezra", "ezralayout"]
comment-token = "//"
indent = { tab-width = 4, unit = "    " }
roots = ["Ezra.toml"]
language-servers = ["ezra-lsp"]

grammar = "ezra"

[language-server.ezra-lsp]
command = "ezrac"
args = ["lsp"]

[[grammar]]
name = "ezra"
source = { git = "https://github.com/isaiahpettingill/ezrac", rev = "af76af767ef0227d93fe714d8771b02c730f7b27", subpath = "editors/tree-sitter-ezra" }

[[language]]
name = "ezra-asm"
scope = "source.ezra-asm"
file-types = ["asm"]
comment-token = ";"
grammar = "ezra_asm"
indent = { tab-width = 4, unit = "    " }

[[grammar]]
name = "ezra_asm"
source = { git = "https://github.com/isaiahpettingill/ezrac", rev = "af76af767ef0227d93fe714d8771b02c730f7b27", subpath = "editors/tree-sitter-ezra-asm" }
